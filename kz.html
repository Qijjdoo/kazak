<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Live TV</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      isolation: isolate;
    }
    /* Gemini-style luminous mist, with an otherwise pure-black canvas. */
    body::before {
      content: "";
      position: fixed;
      z-index: -2;
      inset: -28%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 25% 20% at 31% 46%, rgba(27, 95, 255, .32), transparent 83%),
        radial-gradient(ellipse 29% 22% at 69% 53%, rgba(185, 62, 238, .27), transparent 82%),
        radial-gradient(ellipse 21% 19% at 50% 66%, rgba(52, 211, 255, .16), transparent 83%),
        radial-gradient(ellipse 24% 16% at 56% 39%, rgba(255, 86, 171, .16), transparent 85%);
      filter: blur(42px);
      opacity: .90;
      animation: aurora 16s ease-in-out infinite alternate;
      transform-origin: 50% 50%;
    }
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 54% 35% at 50% 50%, transparent 19%, rgba(0, 0, 0, .48) 90%),
                  linear-gradient(to bottom, rgba(0,0,0,.54), transparent 34%, transparent 65%, rgba(0,0,0,.68));
    }
    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .channels {
      width: min(100%, 760px);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      gap: clamp(12px, 2.6vw, 28px);
      position: relative;
    }
    .channels::before {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      width: 115%;
      height: 300%;
      left: -7.5%;
      top: -100%;
      background: conic-gradient(from 70deg, transparent 0deg, rgba(74, 134, 255, .09) 72deg, transparent 133deg, rgba(232, 93, 255, .12) 215deg, transparent 295deg);
      filter: blur(50px);
      animation: halo 24s linear infinite;
    }
    .channel {
      --glow: 105, 138, 255;
      display: grid;
      place-items: center;
      position: relative;
      width: min(100%, 112px);
      aspect-ratio: 1;
      text-decoration: none;
      color: #fff;
      isolation: isolate;
      border-radius: 29%;
      background: linear-gradient(145deg, rgba(33, 36, 51, .88), rgba(7, 9, 18, .94) 58%, rgba(18, 17, 29, .95));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 28px rgba(0,0,0,.65), 0 0 24px rgba(var(--glow),.11), inset 0 1px 1px rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.04);
      transform: translateZ(0);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .channel::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 34%;
      z-index: -1;
      background: radial-gradient(ellipse, rgba(var(--glow), .23), transparent 72%);
      filter: blur(14px);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }
    .channel::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(140deg, rgba(255,255,255,.10), transparent 36%, transparent 68%, rgba(255,255,255,.025));
    }
    .channel svg { width: 79%; height: 79%; display: block; overflow: visible; }
    .channel:active { transform: scale(.91); }
    .channel:focus-visible { outline: 2px solid #a8b9ff; outline-offset: 9px; }
    @media (hover:hover) {
      .channel:hover {
        transform: translateY(-7px) scale(1.045);
        border-color: rgba(255,255,255,.32);
        box-shadow: 0 16px 36px rgba(0,0,0,.7), 0 0 38px rgba(var(--glow),.33), inset 0 1px 2px rgba(255,255,255,.2);
      }
    }
    .abai { --glow: 255, 192, 99; }
    .balapan { --glow: 45, 183, 255; }
    .qazaqstan { --glow: 255, 76, 115; }
    .rika { --glow: 187, 131, 255; }
    .xinjiang { --glow: 54, 218, 208; }
    .balapan::before, .xinjiang::before { animation-delay: -1.4s; }
    .qazaqstan::before { animation-delay: -2.6s; }
    .rika::before { animation-delay: -3.2s; }
    @media (max-width: 620px) {
      .channels {
        width: min(100%, 378px);
        grid-template-columns: repeat(6, minmax(0, 1fr));
        column-gap: 8px;
        row-gap: clamp(28px, 9vw, 44px);
      }
      .channel { grid-column: span 2; width: min(100%, 99px); }
      .rika { grid-column: 2 / span 2; }
      .xinjiang { grid-column: 4 / span 2; }
    }
    @media (max-width: 350px) {
      .channel { width: min(100%, 85px); }
      .channels { row-gap: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before, .channels::before, .channel::before { animation: none; }
      .channel { transition: none; }
    }
    @keyframes aurora {
      0% { transform: translate3d(-2%, -3%, 0) rotate(-7deg) scale(.98); }
      50% { transform: translate3d(3%, 2%, 0) rotate(7deg) scale(1.07); }
      100% { transform: translate3d(-1%, 4%, 0) rotate(-4deg) scale(1.02); }
    }
    @keyframes halo { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.07); } }
  </style>
</head>
<body>
  <main>
    <nav class="channels" aria-label="直播频道">
      <a class="channel abai" href="https://abaitv-stream.qazcdn.com/abaitv/abaitv/playlist.m3u8" aria-label="播放 Abai TV">

          <path d="M17 71 42 22h16l25 49H69l-7-14H38l-7 14H17zm26-25h14l-7-15-7 15z" fill="url(#a)"/>
          <text x="50" y="87" fill="#f4d5a2" text-anchor="middle" font-size="12" font-weight="750" letter-spacing="3.4">ABAI</text>
        </svg>
      </a>
      <a class="channel balapan" href="https://balapantv-stream.qazcdn.com/balapantv/balapantv/playlist.m3u8" aria-label="播放 Balapan TV">
        <svg viewBox="0 0 100 100" role="img" aria-label="Balapan TV">
          <defs><linearGradient id="b" x1=".1" x2=".9" y1="0" y2="1"><stop stop-color="#ffdf55"/><stop offset="1" stop-color="#ff8c4c"/></linearGradient></defs>
          <circle cx="52" cy="43" r="22" fill="url(#b)"/>
          <path d="M23 54q21-20 39-2Q47 71 26 64" fill="#3fd8ff" opacity=".96"/>
          <path d="M65 44q8-4 17 0l-13 8" fill="#f9b45e"/>
          <circle cx="57" cy="37" r="2.7" fill="#0b213c"/>
          <path d="M35 20 27 13M65 20l7-8" stroke="#ffcf58" stroke-width="4" stroke-linecap="round"/>
          <text x="50" y="86" fill="#e1f9ff" text-anchor="middle" font-size="10.7" font-weight="800" letter-spacing=".7">BALAPAN</text>
        </svg>
      </a>
      <a class="channel qazaqstan" href="https://qazaqstantv-stream.qazcdn.com/qazaqstantv/qazaqstantv/playlist.m3u8" aria-label="播放 Qazaqstan TV">
        <svg viewBox="0 0 100 100" role="img" aria-label="Qazaqstan TV">
          <defs><linearGradient id="q" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff9a8c"/><stop offset="1" stop-color="#ff527e"/></linearGradient></defs>
          <circle cx="49" cy="42" r="24" stroke="url(#q)" stroke-width="10" fill="none"/>
          <path d="m57 53 17 18" stroke="#ffe6e8" stroke-width="10" stroke-linecap="round"/>
          <text x="50" y="89" fill="#ffe1e9" text-anchor="middle" font-size="9.2" font-weight="800" letter-spacing=".65">QAZAQSTAN</text>
        </svg>

      <a class="channel rika" href="https://live-rikatv.cdnvideo.ru/rikatv/rikatv_tcode.sdp/playlist.m3u8" aria-label="播放 Rika TV">
        <svg viewBox="0 0 100 100" role="img" aria-label="Rika TV">
          <defs><linearGradient id="r" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e1baff"/><stop offset="1" stop-color="#9467f7"/></linearGradient></defs>
          <path d="M24 23h39q16 0 16 15 0 11-11 15l12 22H61L49 55h-8v20H24V23zm17 14v7h19q4 0 4-4 0-3-4-3H41z" fill="url(#r)"/>
          <text x="50" y="89" fill="#eadaff" text-anchor="middle" font-size="10.9" font-weight="800" letter-spacing="3.2">RIKA</text>
        </svg>
      </a>
      <a class="channel xinjiang" href="https://st-video.xjmty.com/fs/livedit/e55abfa37af26e19/8ce9971c2177b3dd.m3u8" aria-label="播放 新疆三套">
        <svg viewBox="0 0 100 100" role="img" aria-label="新疆三套">
          <defs><linearGradient id="x" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#a8fff1"/><stop offset="1" stop-color="#36c5d1"/></linearGradient></defs>
          <text x="50" y="68" fill="url(#x)" text-anchor="middle" font-size="65" font-weight="750" letter-spacing="-2">3</text>
          <text x="50" y="88" fill="#bbfff4" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2">新疆三套</text>
        </svg>
      </a>
    </nav>
  </main>
</body>
</html>
